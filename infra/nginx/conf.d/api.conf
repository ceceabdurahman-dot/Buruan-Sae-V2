# ============================================================
# api.conf — Backend API (api.buruansae.bandung.go.id)
# ============================================================

server {
  listen 80;
  server_name api.buruansae.bandung.go.id;

  # Redirect HTTP → HTTPS
  return 301 https://$server_name$request_uri;
}

server {
  listen 443 ssl http2;
  server_name api.buruansae.bandung.go.id;

  # SSL
  ssl_certificate     /etc/letsencrypt/live/buruansae.bandung.go.id/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/buruansae.bandung.go.id/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  # Security headers
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-XSS-Protection "1; mode=block" always;

  # CORS untuk mobile app
  add_header Access-Control-Allow-Origin "$http_origin" always;
  add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
  add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Request-ID" always;
  add_header Access-Control-Max-Age 86400 always;

  if ($request_method = OPTIONS) {
    return 204;
  }

  # Rate limit pada endpoint auth
  location /api/v1/auth {
    limit_req zone=auth burst=10 nodelay;
    limit_req_status 429;

    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }

  # API utama
  location /api/ {
    limit_req zone=api burst=60 nodelay;
    limit_req_status 429;

    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
  }

  # Health check (tidak rate-limited)
  location /health {
    proxy_pass http://backend;
    proxy_set_header Host $host;
    access_log off;
  }

  # Swagger UI (dev/staging only — disable di prod jika perlu)
  location /documentation {
    proxy_pass http://backend;
    proxy_set_header Host $host;
  }
}
