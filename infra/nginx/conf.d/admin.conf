# ============================================================
# admin.conf — Web Admin Next.js (admin.buruansae.bandung.go.id)
# ============================================================

server {
  listen 80;
  server_name admin.buruansae.bandung.go.id;
  return 301 https://$server_name$request_uri;
}

server {
  listen 443 ssl http2;
  server_name admin.buruansae.bandung.go.id;

  ssl_certificate     /etc/letsencrypt/live/buruansae.bandung.go.id/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/buruansae.bandung.go.id/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;

  # Security headers
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.buruansae.bandung.go.id; frame-ancestors 'none';" always;

  # Static assets Next.js — cache agresif
  location /_next/static/ {
    proxy_pass http://web_admin;
    proxy_cache_valid 200 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Next.js Image Optimization
  location /_next/image {
    proxy_pass http://web_admin;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Semua request lainnya → Next.js
  location / {
    proxy_pass http://web_admin;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }
}
