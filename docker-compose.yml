version: '3.9'

# ============================================================
# Docker Compose — DEVELOPMENT
# Buruan Sae 2.0
# ============================================================

services:
  # ----------------------------------------------------------
  # PostgreSQL + PostGIS
  # ----------------------------------------------------------
  postgres:
    image: postgis/postgis:15-3.4-alpine
    container_name: bs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: buruan_sae_dev
      POSTGRES_USER: bs_user
      POSTGRES_PASSWORD: bs_password_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bs_user -d buruan_sae_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # Redis 7
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: bs_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ----------------------------------------------------------
  # MinIO (Object Storage)
  # ----------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: bs_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Web Console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ----------------------------------------------------------
  # Backend (Fastify)
  # ----------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: bs_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://bs_user:bs_password_dev@postgres:5432/buruan_sae_dev
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-change-in-production-min-32-chars
      JWT_REFRESH_SECRET: dev-refresh-secret-change-in-production
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET_PUBLIC: buruan-sae-public
      MINIO_BUCKET_PRIVATE: buruan-sae-private
      CORS_ORIGINS: "http://localhost:3001,http://localhost:3000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - /app/node_modules
    ports:
      - "3000:3000"
    command: ["npm", "run", "dev"]

  # ----------------------------------------------------------
  # Web Admin (Next.js)
  # ----------------------------------------------------------
  web-admin:
    build:
      context: ./web-admin
      dockerfile: Dockerfile.dev
    container_name: bs_web_admin
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: dev-nextauth-secret
    volumes:
      - ./web-admin/src:/app/src
      - ./web-admin/public:/app/public
      - /app/node_modules
      - /app/.next
    ports:
      - "3001:3001"
    command: ["npm", "run", "dev"]

  # ----------------------------------------------------------
  # Mailhog (Email testing — dev only)
  # ----------------------------------------------------------
  mailhog:
    image: mailhog/mailhog:latest
    container_name: bs_mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  default:
    name: bs_network
