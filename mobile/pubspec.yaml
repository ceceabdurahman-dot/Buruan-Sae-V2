name: buruan_sae
description: Aplikasi Buruan Sae 2.0 - Urban Farming Kota Bandung
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigasi
  go_router: ^14.1.4

  # HTTP & API
  dio: ^5.5.0
  # Penyimpanan Lokal
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.1
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # UI Components
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  image_picker: ^1.1.2
  photo_view: ^0.15.0
  fl_chart: ^0.68.0
  table_calendar: ^3.1.2
  intl: ^0.19.0

  # Peta & Lokasi
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^12.0.0
  geocoding: ^3.0.0

  # Notifikasi
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.2.2

  # Kamera & Media
  camera: ^0.11.0+2
  image_cropper: ^8.0.2
  permission_handler: ^11.3.1

  # Offline Sync
  connectivity_plus: ^6.0.3

  # Crash Reporting & Analytics
  firebase_crashlytics: ^4.1.0
  firebase_analytics: ^11.3.0

  # Utilitas
  uuid: ^4.4.2
  crypto: ^3.0.5
  encrypt: ^5.0.3
  url_launcher: ^6.3.0
  share_plus: ^10.0.1
  path_provider: ^2.1.4
  flutter_dotenv: ^5.1.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1
  json_serializable: ^6.8.0
  mockito: ^5.4.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - .env
