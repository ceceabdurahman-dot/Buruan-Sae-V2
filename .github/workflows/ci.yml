name: CI — Buruan Sae 2.0

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'
  FLUTTER_VERSION: '3.22.0'

jobs:
  # ============================================================
  # Backend: Lint + Type-check + Test
  # ============================================================
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15-3.4-alpine
        env:
          POSTGRES_DB: buruan_sae_test
          POSTGRES_USER: bs_test
          POSTGRES_PASSWORD: bs_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 3

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src --ext .ts --max-warnings 0

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://bs_test:bs_test_password@localhost:5432/buruan_sae_test

      - name: Run Migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://bs_test:bs_test_password@localhost:5432/buruan_sae_test

      - name: Run Tests
        run: npm test -- --reporter=verbose
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://bs_test:bs_test_password@localhost:5432/buruan_sae_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-at-least-32-characters-long
          JWT_REFRESH_SECRET: test-refresh-secret-at-least-32-chars

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          directory: backend/coverage
          flags: backend

  # ============================================================
  # Web Admin: Lint + Type-check + Build
  # ============================================================
  web-admin:
    name: Web Admin CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web-admin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web-admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build (production)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.buruansae.bandung.go.id
          NEXTAUTH_URL: https://admin.buruansae.bandung.go.id
          NEXTAUTH_SECRET: ci-nextauth-secret

  # ============================================================
  # Mobile Flutter: Analyze + Test + Build APK
  # ============================================================
  mobile:
    name: Mobile CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code (build_runner)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: mobile/coverage/lcov.info
          flags: mobile

      - name: Build APK (debug)
        run: flutter build apk --debug

  # ============================================================
  # Security: Dependency Audit
  # ============================================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: [backend, web-admin]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit backend
        run: npm audit --audit-level=high
        working-directory: backend
        continue-on-error: true

      - name: Audit web-admin
        run: npm audit --audit-level=high
        working-directory: web-admin
        continue-on-error: true
