name: CD — Deploy Production

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options: [production, staging]

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/pemkot-bandung/buruan-sae-backend
  IMAGE_WEB: ghcr.io/pemkot-bandung/buruan-sae-web-admin

jobs:
  # ============================================================
  # Build & Push Docker Images
  # ============================================================
  build-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      backend_tag: ${{ steps.meta-backend.outputs.tags }}
      web_tag: ${{ steps.meta-web.outputs.tags }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=sha-${GITHUB_SHA::8}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata — Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BACKEND }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push — Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}

      - name: Docker metadata — Web Admin
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_WEB }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push — Web Admin
        uses: docker/build-push-action@v6
        with:
          context: ./web-admin
          file: ./web-admin/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # Deploy ke VPS Biznet Gio
  # ============================================================
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-push
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd /opt/buruan-sae

            echo "🚀 Deploying Buruan Sae 2.0 — ${{ needs.build-push.outputs.version }}"

            # Pull image terbaru
            export BACKEND_VERSION=${{ needs.build-push.outputs.version }}
            export WEB_VERSION=${{ needs.build-push.outputs.version }}

            docker compose -f docker-compose.prod.yml pull backend web-admin

            # Rolling update — zero downtime
            docker compose -f docker-compose.prod.yml up -d --no-deps --scale backend=2 backend
            sleep 10
            docker compose -f docker-compose.prod.yml up -d --no-deps --scale backend=1 backend

            docker compose -f docker-compose.prod.yml up -d --no-deps web-admin

            # Jalankan migrasi database
            docker compose -f docker-compose.prod.yml exec -T backend \
              npx prisma migrate deploy

            # Health check
            sleep 15
            curl -f https://api.buruansae.bandung.go.id/health || exit 1

            # Hapus image lama
            docker image prune -f

            echo "✅ Deploy berhasil — ${{ needs.build-push.outputs.version }}"

      - name: Notify Slack
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            *Buruan Sae 2.0 Deploy* ${{ job.status == 'success' && '✅' || '❌' }}
            Version: `${{ needs.build-push.outputs.version }}`
            Environment: `${{ github.event.inputs.environment || 'production' }}`
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
